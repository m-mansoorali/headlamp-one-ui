apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp-one-ui
  namespace: headlamp-one-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headlamp-one-ui
  template:
    metadata:
      labels:
        app: headlamp-one-ui
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: ui
              mountPath: /usr/share/nginx/html
      volumes:
        - name: ui
          configMap:
            name: headlamp-one-ui