apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp-one-ui
  namespace: headlamp-one-ui
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform
  hostnames:
    - headlamp-one-ui.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: headlamp-one-ui
          port: 80