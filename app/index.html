<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cluster Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Cluster Dashboard</h1>
  </header>

  <main>
    <div id="cluster-container" class="cluster-container">
      <!-- Basic static cluster cards -->
      <div class="cluster-card">
        <h2>Cluster A</h2>
        <p>Environment: Production</p>
        <button>Open</button>
      </div>

      <div class="cluster-card">
        <h2>Cluster B</h2>
        <p>Environment: Staging</p>
        <button>Open</button>
      </div>

      <div class="cluster-card">
        <h2>Cluster C</h2>
        <p>Environment: Development</p>
        <button>Open</button>
      </div>
    </div>
  </main>

  <footer>
    <p>Cluster Dashboard — Work in progress</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
