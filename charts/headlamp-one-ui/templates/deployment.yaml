apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "headlamp-one-ui.fullname" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "headlamp-one-ui.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "headlamp-one-ui.name" . }}
    spec:
      containers:
        - name: ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: ui
              mountPath: /usr/share/nginx/html
      volumes:
        - name: ui
          configMap:
            name: {{ include "headlamp-one-ui.fullname" . }}
